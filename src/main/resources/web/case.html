<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Работа с делом</title><link rel="stylesheet" href="/moderation.css"><main><a href="/">В панель</a><h1>Работа с делом</h1><p role="status" id="status"></p><section><h2 id="heading">Загрузка…</h2><p id="summary"></p><a id="profile"></a><pre id="details"></pre></section><section><h2>Ответственный и состояние</h2><p id="owner"></p><button id="claim">Взять в работу</button><form id="work"><label for="assignee">Передать сотруднику (ник WebAdmin)</label><input id="assignee"><div class="row"><label>Приоритет <select id="priority"><option value="LOW">Низкий</option><option value="NORMAL">Обычный</option><option value="HIGH">Высокий</option><option value="URGENT">Срочный</option></select></label><label>Состояние <select id="work-state"><option value="IN_PROGRESS">В работе</option><option value="WAITING">Ожидает ответа</option></select></label></div><button>Сохранить</button></form></section><section><h2>Внутренние заметки</h2><p class="muted">Видны только сотрудникам. Не отправляются игроку или в его Discord-тикет.</p><div id="notes"></div><form id="note"><textarea id="note-text" maxlength="4000" required></textarea><button>Добавить заметку</button></form></section><section id="appeal" hidden><h2>Переписка с игроком</h2><div id="messages"></div><form id="reply-form"><textarea id="reply" maxlength="2000" required></textarea><button>Ответить игроку</button></form><h2>Решение</h2><textarea id="verdict" minlength="5" maxlength="2000" placeholder="Обязательное объяснение решения"></textarea><button id="approve">Одобрить и снять блокировку</button><button id="reject">Отклонить</button></section></main><script src="/case.js" defer></script></html>
