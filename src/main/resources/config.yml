# LoveWebAdmin · основной конфиг
# Бот, его токен и рабочие категории тикетов настраиваются в LoveCore.
# Здесь: веб-панель, сообщение с кнопками, уведомления и отдельная тестовая песочница.
# После изменения Discord-каналов перезапустите плагин/сервер.
# При обновлении недостающие настройки добавляются с резервной копией исходного файла.
config-version: 2

# ── Веб-панель ─────────────────────────────────────────────────────────────────
web:
  enabled: true
  # 0.0.0.0 — все сетевые интерфейсы; 127.0.0.1 — доступ только с этой машины/через прокси.
  host: "0.0.0.0"
  port: 8080
  # Полный внешний HTTPS-адрес для ссылок из Discord. Без завершающего /.
  # Пример: https://panel.example.com
  public-url: ""
  session-lifetime-minutes: 60

# Первичная настройка управляющего требует одноразовый токен из консоли.
# После создания управляющего повторная первичная настройка недоступна.
owner-setup: true

# ── Настоящие обращения Discord ────────────────────────────────────────────────
discord:
  tickets:
    # ID ТЕКСТОВОГО канала для сообщения «Жалоба / Апелляция / Мои обращения».
    # Это НЕ ID категории. Пусто — постоянная панель не публикуется.
    # Уведомления вебхуком не заменяют бота с кнопками.
    panel-channel-id: ""
    # Другой закрытый текстовый канал персонала: очередь и назначение ответственного.
    # Пусто — служебные карточки отключены. Нельзя указывать тот же канал, что выше.
    queue-channel-id: ""
    # ID Discord-ролей руководства, которым доступны приватные обращения.
    # Обычная staff-role-ids из ядра не открывает новые управляемые тикеты.
    # Роли Discord не выдают права веб-панели: сотрудник должен быть привязан и иметь права.
    supervisor-role-ids: []
    waiting:
      # Все сроки в минутах. 0 отключает только соответствующее напоминание.
      # По истечении срока дело НЕ закрывается, наказание НЕ меняется.
      staff-reminder-minutes: 20
      # Не раньше первого напоминания, если оба порога включены.
      staff-escalation-minutes: 60
      # Напоминание игроку: 2880 минут = 48 часов.
      player-reminder-minutes: 2880

  # Транспорт обычных уведомлений: auto / bot / webhook / both.
  # auto — доступный бот, иначе вебхук; панель с кнопками всегда требует бота.
  reports-transport: auto
  # Дополнительные текстовые каналы уведомлений о жалобах и апелляциях.
  # Эти поля не задают категорию тикетов и не включают панель с кнопками.
  reports-channel-id: ""
  appeals-channel-id: ""
  notifications:
    quiet-hours:
      # Откладывает личные служебные уведомления. Уведомление наказанному игроку не задерживает.
      enabled: false
      start-hour: 23
      end-hour: 8
      timezone: Europe/Moscow

# ── Preview: только тестовые данные ────────────────────────────────────────────
# /preview/ не отключает вход и 2FA настоящей панели.
# Локальный режим моделирует интерфейс; настоящий Discord проверяет серверный Preview.
preview:
  enabled: false
  discord:
    # Шаг 1. Создайте ОТДЕЛЬНУЮ тестовую категорию Discord и скопируйте её ID.
    # Она не должна совпадать с рабочими категориями тикетов, заданными в ядре.
    category-id: ""
    # Шаг 2. Создайте ТЕКСТОВЫЙ канал ВНУТРИ этой категории и скопируйте его ID.
    # Это другой ID! Не вставляйте сюда ID категории или рабочего канала обращений.
    channel-id: ""
    # Шаг 3. ID Discord-пользователей, которым разрешены тестовые формы, ответы и ЛС.
    # Нужен хотя бы один; максимум 10. Это ID пользователей, не ролей и не Minecraft UUID.
    # Пример заполнения:
    # allowed-user-ids:
    #   - "345678901234567890"
    allowed-user-ids: []
    # Шаг 4. В серверном Preview откройте «Сценарии» → «Проверки Discord».
    # «Опубликовать тестовые кнопки» и «Отправить тестовые ЛС» запускаются явно.
    # Автоматическая проверка канала создаёт отдельный тестовый тикет, сохраняет архив
    # и удаляет его. Рабочие наказания, роли и обращения не изменяются.

# ── Безопасность и аварийные уведомления ────────────────────────────────────────
security:
  # Завершать веб-сессию при смене IP.
  strict-ip: false
  maintenance:
    enabled: false
    message: "Ведутся плановые технические работы. Панель временно доступна только руководству."
  password:
    min-length: 12
  login:
    max-attempts: 5
    lockout-minutes: 15
  cors:
    # Обычно оставляют пустым: браузер обращается к API на том же адресе.
    # При необходимости укажите точные origin, например https://panel.example.com.
    allowed-origins: []
  # Команды, запрещённые в веб-консоли даже сотруднику с правом выполнения команд.
  command-blacklist:
    - stop
    - restart
    - end
    - op
    - deop
    - ban
    - ban-ip
    - pardon
    - pardon-ip
    - whitelist
    - plugman
    - pl
    - reload
  # Аварийные уведомления безопасности. Это не настройки бота или панели обращений.
  webhooks:
    enabled: false
    discord:
      enabled: false
      webhook-url: ""
    telegram:
      enabled: false
      bot-token: ""
      chat-id: ""

# ── Экономика и журнал ─────────────────────────────────────────────────────────
economy:
  # Прирост баланса за 5 минут, после которого отмечается аномалия.
  # В медных единицах либо строкой с номиналом: c / i / g / d, например "10d".
  # 200000 соответствует 10 алмазным монетам текущей шкалы LoveCore.
  anomaly-threshold: 200000
logs:
  # Число последних записей серверного журнала, сохраняемых в SQLite.
  keep-count: 5000

# ── Связь ролей панели с LuckPerms ──────────────────────────────────────────────
luckperms:
  sync-enabled: true
  owner-lp-group: "owner"
