web:
  port: 8080
  # "0.0.0.0" биндит панель на все сетевые интерфейсы (доступна с любого IP, который может
  # достучаться до сервера - в том числе с внешней стороны, если хостер не закрыл порт
  # файрволом). Поставьте "127.0.0.1", если панель нужна только локально или через reverse
  # proxy на этой же машине (nginx/Caddy с собственной авторизацией/TLS).
  host: "0.0.0.0"
  session-lifetime-minutes: 60

# Первый кто открывает веб-панель становится Управляющим (owner)
# После установки owner — эта настройка игнорируется
owner-setup: true

# Режим отладки (debug-mode):
# Если включено (true), позволяет входить в систему, регистрироваться и выполнять первичную настройку
# без обязательного сканирования QR-кода / подтверждения через Google Authenticator.
debug-mode: false

# Экономика (2026-10-03: пересчёт под номиналы LoveCore 1 / 100 / 2 000 / 20 000).
economy:
  # Прирост баланса игрока за 5 минут, после которого пишется «аномалия» (вероятный дюп). Число (медные
  # единицы) или строка "10d" (c = медная, i = железная, g = золотая, d = алмазная).
  # 2026-10-03: 50 000 → 200 000 (10 алмазных монет). Старый порог при новой шкале был бы ≈ 2.5 алмазных
  # монет — это обычная сделка «очень богатого» игрока, и журнал забился бы ложными аномалиями.
  # Срезы экономики помечаются версией шкалы LoveCore (economy.scale-version): график «в обращении»
  # имеет разрыв на смене номиналов — сравнивайте значения только внутри одной версии.
  anomaly-threshold: 200000

logs:
  # Сколько последних записей серверных логов держать в БД
  keep-count: 5000

luckperms:
  # Синхронизировать роль веб-панели с LP группой
  sync-enabled: true
  # Маппинг: role-name -> luckperms-group-name
  # Управляющий всегда синхронизируется с группой "owner"
  owner-lp-group: "owner"

security:
  # Строгий режим сессий: принудительный логаут при смене IP адреса
  strict-ip: false
  # Режим технических работ
  maintenance:
    enabled: false
    message: "Ведутся плановые технические работы. Панель временно доступна только руководству."
  password:
    min-length: 12
  login:
    # Сколько неудачных попыток входа (по IP или по нику) допускается в течение окна ниже
    max-attempts: 5
    # На сколько минут блокировать вход после превышения max-attempts
    lockout-minutes: 15
  cors:
    # Список разрешённых origin'ов для CORS запросов к API (например "https://panel.example.com")
    # По умолчанию пусто — CORS заголовки не отправляются (доступ только same-origin)
    # Никогда не используйте "*" — это небезопасно вместе с заголовком Authorization
    allowed-origins: []
  # Команды, запрещённые к выполнению через веб-панель, даже если у роли есть EXECUTE_COMMANDS
  command-blacklist:
    - stop
    - restart
    - end
    - op
    - deop
    - ban
    - ban-ip
    - pardon
    - pardon-ip
    - whitelist
    - plugman
    - pl
    - reload
  webhooks:
    enabled: false
    discord:
      enabled: false
      webhook-url: ""
    telegram:
      enabled: false
      bot-token: ""
      chat-id: ""

