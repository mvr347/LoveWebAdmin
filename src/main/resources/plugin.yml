name: LoveWebAdmin
version: '${project.version}'

main: me.lovelace.loveWebAdmin.LoveWebAdmin
api-version: '26.2'
load: POSTWORLD
description: Веб-панель администрирования для Love* серверов
authors: [ Lovelace ]
depend: [LoveCore, LoveEssential]
softdepend: [LuckPerms, Vesuvio, LoveAuth]

commands:
  lovewebadmin:
    description: LoveWebAdmin управление
    usage: /lovewebadmin <reload>
    aliases: [ lwa ]
    permission: lovewebadmin.admin
    permission-message: ""
  бан:
    description: Предварительная блокировка с оформлением в течение пяти минут
    usage: /бан <игрок>
    aliases: [ ban, webban, lban ]
    permission: lovewebadmin.ban
    permission-message: ""
  report:
    description: Подача жалобы на игрока
    usage: /report <никнейм>
    aliases: [ репорт, жалоба ]
    permission: lovewebadmin.report
    permission-message: ""
  разбан:
    description: Снятие бана с игрока на сервере и в WebAdmin
    usage: /разбан <игрок>
    aliases: [ unban, webunban, lunban, pardon ]
    permission: lovewebadmin.unban
    permission-message: ""

  mute:
    description: Модерация игроков
    aliases: [мут]
    permission: lovewebadmin.mute
    permission-message: ""
  unmute:
    description: Модерация игроков
    aliases: [размут]
    permission: lovewebadmin.unmute
    permission-message: ""
  freeze:
    description: Модерация игроков
    aliases: [заморозить]
    permission: lovewebadmin.freeze
    permission-message: ""
  unfreeze:
    description: Модерация игроков
    aliases: [разморозить]
    permission: lovewebadmin.unfreeze
    permission-message: ""
  kick:
    description: Модерация игроков
    aliases: [кик]
    permission: lovewebadmin.kick
    permission-message: ""

permissions:
  lovewebadmin.admin:
    description: Доступ к команде /lovewebadmin (алиас /lwa)
    default: op
  lovewebadmin.ban:
    description: Доступ к созданию банов через /бан
    default: op
  lovewebadmin.unban:
    description: Доступ к разбану игроков через /разбан (алиасы /unban, /pardon)
    default: op
  lovewebadmin.report:
    description: Доступ к отправке жалоб через /репорт
    default: true


  lovewebadmin.mute:
    default: op

  lovewebadmin.unmute:
    default: op

  lovewebadmin.freeze:
    default: op

  lovewebadmin.unfreeze:
    default: op

  lovewebadmin.kick:
    default: op

  lovewebadmin.supervise:
    default: op
